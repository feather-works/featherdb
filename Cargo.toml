[workspace]
resolver = "2"
members = ["crates/featherdb-core", "crates/featherdb"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
strip = true

# O pelicano desenha na CPU: dependências otimizadas mesmo no `cargo run`.
[profile.dev.package."*"]
opt-level = 2
