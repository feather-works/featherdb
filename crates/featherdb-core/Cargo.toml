[package]
name = "featherdb-core"
description = "FeatherDB: conexões, consultas e catálogo (Postgres, MySQL, SQLite e ODBC)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
postgres = "0.19"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
mysql = { version = "26", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
# SQLite: o C vem compilado dentro do binário (nada para instalar no sistema).
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
# ODBC é carregado na hora de conectar: o app abre mesmo sem o unixODBC instalado.
libloading = "0.8"
# Senhas lembradas: no cofre do sistema (Secret Service no Linux, Credenciais no Windows), nunca em arquivo.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
# MongoDB: o driver oficial, 100% Rust (TLS com rustls, DNS do mongodb+srv:// sem biblioteca do sistema).
mongodb = { version = "3", features = ["sync"] }
# Os argumentos dos comandos do Mongo vêm no jeito do shell (chave sem aspas, aspas simples): JSON5.
json5 = "1"
serde_json = "1"
# Túnel SSH (o banco atrás de um servidor). Com `ring`, o mesmo do TLS: sem aws-lc (C).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }
